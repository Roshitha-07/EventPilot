{% extends 'base.html' %}{% set page_title='Edit Participant' %}{% set active='attendees' %}
{% block content %}<div class="page-head"><div><span class="eyebrow">PARTICIPANT MANAGEMENT</span><h1>Edit Participant</h1><p>Update basic participant details.</p></div><a class="action-link" href="/attendees">Back to participants</a></div><div class="section"><div class="form-panel" style="max-width:650px"><form method="POST" class="form-grid"><input name="name" value="{{attendee[3]}}" placeholder="Name" required><input name="phone" value="{{attendee[5]}}" placeholder="Phone" required><input class="full" name="location" value="{{attendee[7]}}" placeholder="Location" required><button class="primary-button full" type="submit">Save participant</button></form></div></div>{% endblock %}
