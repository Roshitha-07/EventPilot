<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login · EventPilot</title><link rel="stylesheet" href="{{ url_for('static',filename='css/style.css') }}"></head><body><div class="login-wrap"><div class="auth-card"><a class="back-link" href="/">← Back to EventPilot</a><div style="margin-top:22px"><span class="brand-mark">EP</span></div><h1>{{ 'Organizer' if selected_role == 'organizer' else 'Participant' }} login</h1><p class="muted">Sign in to continue to your EventPilot workspace.</p><form method="POST"><input type="hidden" name="role" value="{{ selected_role }}"><input name="email" type="email" placeholder="Email address" required><input name="password" type="password" placeholder="Password" required><button type="submit">Sign in</button></form>{% if selected_role == 'attendee' %}<p class="muted" style="margin-top:18px">New participant? <a href="/attendee/register" style="color:#5d54d6;font-weight:800">Create an account</a></p>{% endif %}</div></div></body></html>
