{% extends 'base.html' %}{% set page_title='Add Sponsor' %}{% set active='sponsors' %}
{% block content %}<div class="page-head"><div><span class="eyebrow">SPONSORSHIP AGENT</span><h1>Add Sponsor</h1><p>Create a partner profile with commercial and activation details.</p></div><a class="action-link" href="/sponsors">Back to sponsors</a></div><div class="section"><div class="form-panel"><form method="POST" class="form-grid"><input name="name" placeholder="Contact name" required><input name="company" placeholder="Company" required><input name="contact_email" type="email" placeholder="Contact email"><input name="phone" placeholder="Phone"><select name="package"><option>Silver</option><option>Gold</option><option>Platinum</option></select><input name="budget" type="number" step="0.01" placeholder="Budget"><input name="committed_amount" type="number" step="0.01" placeholder="Committed amount"><input name="delivered_value" type="number" step="0.01" placeholder="Delivered value"><input name="leads" type="number" placeholder="Leads"><input name="impressions" type="number" placeholder="Impressions"><input name="engagements" type="number" placeholder="Engagements"><select name="status"><option>Active</option><option>At Risk</option><option>Completed</option></select><input name="rating" type="number" step="0.1" min="0" max="5" placeholder="Rating /5"><input name="contract_start" type="date"><input name="contract_end" type="date"><input name="contract_value" type="number" step="0.01" placeholder="Contract value"><input name="payment_status" placeholder="Payment status"><input name="amount_paid" type="number" step="0.01" placeholder="Amount paid"><textarea class="full" name="deliverables" placeholder="Deliverables"></textarea><textarea class="full" name="branding_requirements" placeholder="Branding requirements"></textarea><textarea class="full" name="notes" placeholder="Notes"></textarea><button class="primary-button full" type="submit">Save Sponsor</button></form></div></div>{% endblock %}
